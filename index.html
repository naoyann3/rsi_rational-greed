/**
 * =================================================================
 *  2. CORE LOGIC: Timeline, Parsing, RSI, SMA
 * =================================================================
 */

function generateWeeklyTimeline() {
    const timeline = [];
    let current = new Date(2021, 0, 1);
    while (current.getDay() !== 5) current.setDate(current.getDate() + 1); // 金曜
    const end = new Date(2030, 11, 31);
    while (current <= end) {
        timeline.push(new Date(current));
        current.setDate(current.getDate() + 7);
    }
    return timeline;
}
const masterTimeline = generateWeeklyTimeline();

function parseAndAlignData(text) {
    const assets = {};
    const lines = text.trim().split('\n');
    let currentAsset = null;
    let currentYear = null;
    const rawPoints = {}; 

    for (let i = 0; i < lines.length; i++) {
        let line = lines[i].trim();
        if (!line) continue;
        if (/[a-zA-Z]/.test(line) && !line.includes(',') && !line.includes('年')) {
            const match = line.match(/\((.*?)\)/);
            currentAsset = match ? match[1] : line.split(' ')[0];
            rawPoints[currentAsset] = [];
            continue;
        }
        if (line.includes('年') && !line.includes(',')) {
            currentYear = parseInt(line.replace('年', '').trim());
            continue;
        }
        if (currentAsset && currentYear) {
            const parts = line.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);
            if (parts) {
                for (let j = 0; j < parts.length; j += 2) {
                    let dateStr = parts[j] ? parts[j].replace(/,/g, '').trim() : null;
                    let priceStr = parts[j+1] ? parts[j+1].replace(/"/g, '').trim() : null;
                    if (dateStr && isNaN(parseInt(dateStr.split('/')[0]))) {
                        const engMonth = {Jan:1, Feb:2, Mar:3, Apr:4, May:5, Jun:6, Jul:7, Aug:8, Sep:9, Oct:10, Nov:11, Dec:12};
                        const [mName, dVal] = dateStr.split(' ');
                        if(engMonth[mName]) dateStr = `${engMonth[mName]}/${dVal}`;
                    }
                    if (dateStr && priceStr) {
                        const [m, d] = dateStr.split('/').map(Number);
                        const date = new Date(currentYear, m - 1, d);
                        const price = parseFloat(priceStr.replace(/,/g, ''));
                        if (!isNaN(price) && price > 0) {
                            rawPoints[currentAsset].push({ date, price });
                        }
                    }
                }
            }
        }
    }

    Object.keys(rawPoints).forEach(asset => {
        rawPoints[asset].sort((a, b) => a.date - b.date);
        if(rawPoints[asset].length === 0) return;
        const alignedData = [];
        let lastPrice = rawPoints[asset][0].price;
        const lastAvailableDate = rawPoints[asset][rawPoints[asset].length - 1].date;

        masterTimeline.forEach(targetDate => {
            if (targetDate > lastAvailableDate) {
                alignedData.push({ x: targetDate.toISOString(), y: null });
                return;
            }
            const nearest = rawPoints[asset].find(p => Math.abs(p.date - targetDate) < 4 * 24 * 60 * 60 * 1000);
            if (nearest) lastPrice = nearest.price;
            
            if (targetDate < rawPoints[asset][0].date) {
                alignedData.push({ x: targetDate.toISOString(), y: null });
            } else {
                alignedData.push({ x: targetDate.toISOString(), y: lastPrice });
            }
        });
        assets[asset] = alignedData;
    });
    return assets;
}

function calculateRSI(dataPoints) {
    if (!dataPoints || dataPoints.length === 0) return [];
    const prices = dataPoints.map(p => p.y);
    const period = 14;
    const rsiArray = new Array(prices.length).fill(null);
    
    let lastPrice = null;
    let gains = 0, losses = 0, count = 0;
    let i = 0;
    
    for (; i < prices.length; i++) {
        if (prices[i] === null) continue;
        if (lastPrice === null) { lastPrice = prices[i]; continue; }
        const diff = prices[i] - lastPrice;
        if (diff > 0) gains += diff; else losses -= diff;
        lastPrice = prices[i];
        if (++count === period) break;
    }
    
    if (count < period) return rsiArray;
    let avgG = gains / period, avgL = losses / period;
    rsiArray[i] = 100 - (100 / (1 + (avgG / (avgL || 0.00001))));

    for (let k = i + 1; k < prices.length; k++) {
        if (prices[k] === null) continue;
        const diff = prices[k] - lastPrice;
        const g = diff > 0 ? diff : 0, l = diff < 0 ? -diff : 0;
        avgG = (avgG * 13 + g) / 14; avgL = (avgL * 13 + l) / 14;
        rsiArray[k] = 100 - (100 / (1 + (avgG / (avgL || 0.00001))));
        lastPrice = prices[k];
    }
    return rsiArray;
}

function calculateSMA(data, period) {
    return data.map((p, i) => {
        if (p.y === null || i < period - 1) return { x: p.x, y: null };
        let sum = 0, cnt = 0;
        for (let j = 0; j < period; j++) {
            if (data[i-j].y !== null) { sum += data[i-j].y; cnt++; }
        }
        return { x: p.x, y: cnt === period ? sum / period : null };
    });
}

const alignedAssets = parseAndAlignData(rawTextData);
let activeKeys = Object.keys(alignedAssets).filter(key => key !== 'USDJPY');
let selectedCurrency = 'USD';
let myChart = null;

/**
 * =================================================================
 *  3. DCA SIMULATION ENGINE (FIXED)
 * =================================================================
 */
function updateDCASimulation() {
    const amount = parseFloat(document.getElementById('dca-amount').value) || 0;
    const container = document.getElementById('dca-results');
    container.innerHTML = '';

    const keysToCalculate = activeKeys.filter(k => k !== 'USDJPY');
    const usdjpyData = alignedAssets['USDJPY'];
    
    // 初期レート取得
    let lastValidRate = 110;
    if (usdjpyData) {
        const first = usdjpyData.find(p => p.y !== null);
        if (first) lastValidRate = first.y;
    }

    keysToCalculate.forEach(key => {
        const data = alignedAssets[key];
        if (!data) return;

        let totalUnits = 0, totalInvUSD = 0, totalInvJPY = 0, validWeeks = 0;
        let currentRate = lastValidRate;

        data.forEach((point, idx) => {
            // レート更新
            if (usdjpyData[idx] && usdjpyData[idx].y !== null) currentRate = usdjpyData[idx].y;

            if (point.y !== null && point.y > 0) {
                const priceUSD = point.y;
                let invUSD, invJPY, units;

                if (selectedCurrency === 'JPY') {
                    invJPY = amount;
                    invUSD = amount / currentRate;
                    units = invUSD / priceUSD;
                } else {
                    invUSD = amount;
                    invJPY = amount * currentRate;
                    units = invUSD / priceUSD;
                }

                totalUnits += units;
                totalInvUSD += invUSD;
                totalInvJPY += invJPY;
                validWeeks++;
            }
        });

        if (validWeeks === 0) return;

        // 最終評価
        const lastValidPoint = [...data].reverse().find(p => p.y !== null);
        const finalUSD = lastValidPoint.y;
        
        // 最新レート取得
        let latestRate = currentRate;
        const lastRatePoint = [...usdjpyData].reverse().find(p => p.y !== null);
        if (lastRatePoint) latestRate = lastRatePoint.y;

        const valUSD = totalUnits * finalUSD;
        const valJPY = valUSD * latestRate;

        let profitPct, dispInv, dispVal;
        if (selectedCurrency === 'JPY') {
            profitPct = ((valJPY - totalInvJPY) / totalInvJPY) * 100;
            dispInv = totalInvJPY; dispVal = valJPY;
        } else {
            profitPct = ((valUSD - totalInvUSD) / totalInvUSD) * 100;
            dispInv = totalInvUSD; dispVal = valUSD;
        }

        const avgCostJPY = totalInvJPY / totalUnits;
        const curPriceJPY = finalUSD * latestRate;

        // Render Card
        const colorMap = {
            'NVDA': '#10b981', 'BTC-USD': '#f97316', '^GSPC': '#3b82f6', 'GLD': '#eab308', 
            'SLV': '#94a3b8', 'SMH': '#818cf8', 'TSM': '#60a5fa', 'ASML': '#1e40af', 
            'CRWD': '#06b6d4', 'PLTR': '#a855f7', 'AVGO': '#1e3a8a', 'AMD': '#ef4444', 'ITA': '#15803d'
        };
        const color = colorMap[key] || '#64748b';
        const symbol = selectedCurrency === 'JPY' ? '¥' : '$';

        const card = document.createElement('div');
        card.className = "card p-4 border-l-4";
        card.style.borderLeftColor = color;
        card.innerHTML = `
            <div class="flex justify-between items-start mb-2">
                <span class="font-bold text-slate-800">${key}</span>
                <span class="text-xs font-mono px-2 py-0.5 rounded ${profitPct >= 0 ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}">
                    ${profitPct >= 0 ? '+' : ''}${profitPct.toFixed(1)}%
                </span>
            </div>
            <div class="grid grid-cols-2 gap-2 text-[11px] mb-3">
                <div><p class="text-slate-400">投資元本</p><p class="font-bold text-slate-700">${symbol}${dispInv.toLocaleString(undefined,{maximumFractionDigits:0})}</p></div>
                <div><p class="text-slate-400">評価額</p><p class="font-bold text-slate-700">${symbol}${dispVal.toLocaleString(undefined,{maximumFractionDigits:0})}</p></div>
                <div><p class="text-slate-400">投資週数</p><p class="font-bold text-slate-700">${validWeeks}週</p></div>
                <div><p class="text-slate-400">保有数量</p><p class="font-bold text-slate-700">${totalUnits.toFixed(4)}</p></div>
            </div>
            <div class="pt-2 border-t border-slate-100 text-[10px] text-slate-400 grid grid-cols-2 gap-y-1">
                <div>平均取得(円): ¥${avgCostJPY.toLocaleString(undefined,{maximumFractionDigits:0})}</div>
                <div>現在株価(円): ¥${curPriceJPY.toLocaleString(undefined,{maximumFractionDigits:0})}</div>
                <div>為替レート: ¥${latestRate.toFixed(2)}</div>
                <div>取得総コスト: ¥${totalInvJPY.toLocaleString(undefined,{maximumFractionDigits:0})}</div>
            </div>
        `;
        container.appendChild(card);
    });
}

/**
 * =================================================================
 *  4. CHART RENDER
 * =================================================================
 */
function renderChart() {
    const ctx = document.getElementById('mainChart').getContext('2d');
    const datasets = [];
    const displayKeys = activeKeys.filter(k => k !== 'USDJPY');

    displayKeys.forEach(key => {
        const data = alignedAssets[key];
        const firstValid = data.find(p => p.y !== null);
        const base = firstValid ? firstValid.y : 1;

        const normalized = data.map(p => ({ x: p.x, y: p.y === null ? null : (p.y / base) * 100 }));
        const rsi = calculateRSI(data);
        const sma = calculateSMA(normalized, 40);

        const colorMap = {
            'NVDA': '#10b981', 'BTC-USD': '#f97316', '^GSPC': '#3b82f6', 'GLD': '#eab308', 
            'SLV': '#94a3b8', 'SMH': '#818cf8', 'TSM': '#60a5fa', 'ASML': '#1e40af', 
            'CRWD': '#06b6d4', 'PLTR': '#a855f7', 'AVGO': '#1e3a8a', 'AMD': '#ef4444', 'ITA': '#15803d'
        };
        const color = colorMap[key] || '#64748b';

        // Main Line
        datasets.push({
            label: key, data: normalized, borderColor: color, borderWidth: 2, pointRadius: 0, tension: 0.1, order: 2
        });
        // SMA Line
        datasets.push({
            label: '', data: sma, borderColor: color, borderWidth: 1, borderDash: [3, 3], pointRadius: 0, tension: 0.3, order: 3
        });
        // RSI Signals
        const signals = normalized.map((p, idx) => (rsi[idx] !== null && rsi[idx] < 35) ? p : null).filter(p => p);
        if (signals.length > 0) {
            datasets.push({
                label: '', data: signals, backgroundColor: '#e11d48', borderColor: '#fff', borderWidth: 1, 
                pointStyle: 'rectRot', pointRadius: 6, showLine: false, order: 1
            });
        }
    });

    if (myChart) myChart.destroy();
    myChart = new Chart(ctx, {
        type: 'line',
        data: { datasets },
        options: {
            responsive: true, maintainAspectRatio: false,
            interaction: { mode: 'nearest', intersect: false, axis: 'x' },
            plugins: {
                legend: { position: 'bottom', labels: { usePointStyle: true, filter: item => item.text !== '' } },
                tooltip: { callbacks: { label: (c) => c.dataset.label ? `${c.dataset.label}: ${c.raw.y.toFixed(1)}%` : null } }
            },
            scales: {
                x: { type: 'time', time: { unit: 'month' }, grid: { color: '#f1f5f9' } },
                y: { grid: { color: '#f1f5f9' }, ticks: { callback: v => (v-100) + '%' } }
            }
        }
    });
    document.getElementById('loading').style.display = 'none';
    updateDCASimulation();
}

/**
 * =================================================================
 *  5. INITIALIZATION
 * =================================================================
 */
function init() {
    const btnContainer = document.getElementById('asset-buttons');
    Object.keys(alignedAssets).filter(k => k !== 'USDJPY').forEach(key => {
        const btn = document.createElement('button');
        const match = key.match(/\((.*?)\)/);
        btn.textContent = match ? match[1] : key.split(' ')[0];
        btn.className = `btn-asset px-3 py-1.5 rounded-md shadow-sm ${activeKeys.includes(key) ? 'active' : ''}`;
        btn.onclick = () => {
            if (activeKeys.includes(key)) activeKeys = activeKeys.filter(k => k !== key);
            else activeKeys.push(key);
            btn.classList.toggle('active');
            renderChart();
        };
        btnContainer.appendChild(btn);
    });

    document.getElementById('currency-usd').onclick = (e) => {
        selectedCurrency = 'USD';
        e.target.classList.add('active');
        document.getElementById('currency-jpy').classList.remove('active');
        document.getElementById('currency-symbol').textContent = '$';
        updateDCASimulation();
    };
    document.getElementById('currency-jpy').onclick = (e) => {
        selectedCurrency = 'JPY';
        e.target.classList.add('active');
        document.getElementById('currency-usd').classList.remove('active');
        document.getElementById('currency-symbol').textContent = '¥';
        updateDCASimulation();
    };
    document.getElementById('dca-amount').oninput = updateDCASimulation;

    renderChart();
}

window.onload = init;

</script>
</body>
</html>
